<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rounded Shield / Tile -->
  <rect width="512" height="512" rx="128" fill="#090d16"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" opacity="0.15"/>
  <rect x="24" y="24" width="464" height="464" rx="104" stroke="url(#accentGrad)" stroke-width="6" fill="none" opacity="0.4"/>

  <!-- Center Hexagon / Shield Brand Mark -->
  <g transform="translate(256, 256) scale(1.15)">
    <!-- Outer Ring -->
    <circle r="120" stroke="url(#accentGrad)" stroke-width="12" fill="none" opacity="0.3" stroke-dasharray="24 12"/>
    
    <!-- Verified Shield Polygon -->
    <path d="M 0,-100 L 80,-50 L 80,40 C 80,95 0,135 0,135 C 0,135 -80,95 -80,40 L -80,-50 Z" 
          fill="url(#bgGrad)" 
          filter="url(#glow)"/>
    
    <!-- Checkmark & Sparkle -->
    <path d="M -35,5 L -10,32 L 40,-25" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="18" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    
    <!-- Top Sparkle Star -->
    <polygon points="0,-130 10,-110 30,-110 15,-95 22,-75 0,-88 -22,-75 -15,-95 -30,-110 -10,-110" 
             fill="#38bdf8"/>
  </g>
</svg>
